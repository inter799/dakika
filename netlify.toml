# Netlify 部署配置
# 在 Netlify Dashboard → Environment Variables 添加：
#   SUPABASE_URL, SUPABASE_ANON_KEY

[build]
  command = "echo 'Build complete'"
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "none"

# 所有请求 → Flask 处理
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
